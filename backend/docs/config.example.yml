  #   api_key: $OPENAI_API_KEY # 使用环境变量
  #   request_timeout: 600.0
  #   max_retries: 2
  #   max_tokens: 4096
  #   temperature: 0.7
  #   supports_vision: true # 为 view_image 工具启用 vision 支持

  # 示例：OpenAI Responses API 模型
  # - name: gpt-5-responses
  #   display_name: GPT-5 (Responses API)
  #   use: langchain_openai:ChatOpenAI
  #   model: gpt-5
  #   api_key: $OPENAI_API_KEY
  #   request_timeout: 600.0
  #   max_retries: 2
  #   use_responses_api: true
  #   output_version: responses/v1
  #   supports_vision: true

  # 示例：Ollama（原生 provider — 保留 thinking/reasoning 内容）
  #
  # 重要：对于 Ollama 模型，使用 langchain_ollama:ChatOllama 而不是
  # langchain_openai:ChatOpenAI。OpenAI 兼容端点（/v1/chat/completions）
  # 不会将 reasoning_content 作为单独字段返回 — thinking 内容要么被扁平化
  # 到 <think> 标签中，要么完全丢弃（ollama/ollama#15293）。
  # 原生 Ollama API（/api/chat）正确地将 thinking 与响应内容分开。
  #
  # 安装：cd backend && uv pip install 'deerflow-harness[ollama]'
