# ============================================================================
# Guardrails 配置
# ============================================================================
# Tool calls 的可选预执行授权。
# 启用后，每个 tool call 在执行前通过配置的 provider。
# 三种选项：内置 allowlist、OAP 策略 provider 或自定义 provider。
# 完整文档见 backend/docs/GUARDRAILS.md。
#
# Providers 通过 resolve_variable 按类路径加载（与 models/tools 相同）。

# --- 选项 1：内置 AllowlistProvider（零外部依赖）---
# guardrails:
#   enabled: true
#   provider:
#     use: deerflow.guardrails.builtin:AllowlistProvider
#     config:
#       denied_tools: ["bash", "write_file"]

# --- 选项 2：OAP passport provider（开放标准，任何实现）---
#   Open Agent Passport (OAP) 规范定义 passport 格式和决策码。
#   任何 OAP 兼容 provider 都可以工作。使用 APort（参考实现）的示例：
#     pip install aport-agent-guardrails && aport setup --framework deerflow
# guardrails:
#   enabled: true
#   provider:
#     use: aport_guardrails.providers.generic:OAPGuardrailProvider

# --- 选项 3：自定义 provider（任何具有 evaluate/aevaluate 方法的类）---
# guardrails:
#   enabled: true
#   provider:
#     use: my_package:MyGuardrailProvider
#     config:
#       key: value

# ============================================================================
# 熔断器配置
# ============================================================================
# LLM 调用熔断器防止向故障 provider 重复请求。
# 当失败阈值达到时，后续调用快速失败直到恢复。
#
# 这对于以下情况很有用：
# - 在 provider 停机期间避免 rate-limit 禁令
# - 减少重试循环中的资源耗尽
# - 在 LLM 服务不可用时优雅降级

# circuit_breaker:
#   # 打开电路前的连续失败次数（默认：5）
#   failure_threshold: 5
#   # 尝试恢复前的秒数（默认：60）
#   recovery_timeout_sec: 60