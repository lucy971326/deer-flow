  # 示例：通过 OpenAI 兼容网关的 Gemini 模型（带 thinking 支持）
  # 使用 PatchedChatOpenAI 以便在多轮 tool-call 对话中保留 tool_calls 上的
  # tool-call thought_signature 值 — 启用 thinking 时 Gemini API 需要此配置。
  # 见：https://docs.cloud.google.com/vertex-ai/generative-ai/docs/thought-signatures
