# DeerFlow 应用配置
#
# 使用指南：
# - 将此文件复制到 `config.yaml` 并根据你的环境进行自定义
# - 默认路径是项目根目录下的 `config.yaml`。
#   你可以设置 `DEER_FLOW_PROJECT_ROOT` 来明确定义根目录，
#   或使用 `DEER_FLOW_CONFIG_PATH` 指向特定配置文件。
# - 运行时状态默认为项目根目录下的 `.deer-flow`。
#   当需要不同的可写数据目录时，用 `DEER_FLOW_HOME` 覆盖。
# - 所有字段值都支持环境变量。例如：`api_key: $OPENAI_API_KEY`
# - `use` 路径格式为 "package_name.sub_package_name.module_name:class_name/variable_name"。

# ============================================================================
# 配置版本（用于检测过时的配置文件）
# ============================================================================
# 当配置 schema 变更时，递增此数字。
# 运行 `make config-upgrade` 将新字段合并到本地 config.yaml。
config_version: 9

# ============================================================================
# 日志级别
# ============================================================================
# deerflow 模块的日志级别（debug/info/warning/error）
log_level: info

# ============================================================================
# Token 使用量统计
# ============================================================================
# 启用 token 使用量收集和显示。
# 启用后，DeerFlow 记录每次模型调用的输入/输出/总 tokens，
# 并在 providers 返回时在 workspace UI 中显示使用量元数据。
token_usage:
  enabled: true

# ============================================================================
# 模型配置
# ============================================================================
# 配置 agent 可用的 LLM models

