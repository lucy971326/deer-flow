  #   max_tokens: 16000
  #   supports_vision: true
  #   supports_thinking: true
  #   when_thinking_enabled:
  #     thinking:
  #       type: enabled
  #       budget_tokens: 4096   # 必需；最小 1024；必须 < max_tokens
  #   when_thinking_disabled:
  #     thinking:
  #       type: disabled

  # 示例：Google Gemini 模型（原生 SDK，无 thinking 支持）
