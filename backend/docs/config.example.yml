  # - name: qwen3-local
  #   display_name: Qwen3 32B (Ollama)
  #   use: langchain_ollama:ChatOllama
  #   model: qwen3:32b
  #   base_url: http://localhost:11434   # 不带 /v1 后缀 — 使用原生 /api/chat
  #   num_predict: 8192
  #   temperature: 0.7
  #   reasoning: true                    # 传递 think:true 到 Ollama 原生 API
  #   supports_thinking: true
  #   supports_vision: false
  #
  # - name: gemma4-local
  #   display_name: Gemma 4 27B (Ollama)
  #   use: langchain_ollama:ChatOllama
  #   model: gemma4:27b
  #   base_url: http://localhost:11434
  #   num_predict: 8192
  #   temperature: 0.7
  #   reasoning: true
  #   supports_thinking: true
  #   supports_vision: true
  #
  # Docker 部署时，使用 host.docker.internal 而不是 localhost：
  #   base_url: http://host.docker.internal:11434

  # 示例：Anthropic Claude 模型（带扩展思考）
  # 需要 supports_thinking: true — 没有它，DeerFlow 即使在 UI thinking 切换打开时
  # 也会静默回退到非 thinking 模式。
  # budget_tokens 是 Anthropic API 启用 thinking.type=enabled 时必需的
  # （无 server 默认；最小 1024；必须小于 max_tokens）。
  # - name: claude-sonnet-4
  #   display_name: Claude Sonnet 4
  #   use: langchain_anthropic:ChatAnthropic
  #   model: claude-sonnet-4-20250514
