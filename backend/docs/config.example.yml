#
#     # 可选：channel 级 session 覆盖
#     session:
#       assistant_id: mobile-agent  # 这里也支持自定义 agent 名称
#       context:
#         thinking_enabled: false
#
#       # 可选：按 user_id 的 per-user 覆盖
