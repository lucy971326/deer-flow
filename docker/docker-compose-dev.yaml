# DeerFlow 开发环境
# Usage: docker-compose -f docker-compose-dev.yaml up --build
#
# Services:
#   - nginx: 反向代理（端口 2026）
#   - frontend: Frontend Next.js 开发服务器（端口 3000）
#   - gateway: Backend Gateway API + agent runtime（端口 8001）
#   - provisioner (可选): 沙箱管理器（在宿主机 Kubernetes 中创建 Pod）
#
# 前置条件:
#   - 只有在使用 provisioner 模式时才需要 Kubernetes 集群 + kubeconfig。
#
# 访问地址: http://localhost:2026

services:
  # ── Sandbox Provisioner（沙箱管理器）─────────────────────────────────
  # 通过 K8s API 管理宿主机 Kubernetes 集群中每个沙箱的 Pod 和 Service 生命周期。
  # Backend 直接通过 host.docker.internal:{NodePort} 访问沙箱。
  provisioner:
    build:
      context: ./provisioner
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
    container_name: deer-flow-provisioner
    volumes:
      - ~/.kube/config:/root/.kube/config:ro
    environment:
      - K8S_NAMESPACE=deer-flow
      - SANDBOX_IMAGE=enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:latest
      # K8s HostPath 卷的主机路径（必须是 K8s 节点可访问的绝对路径）
      # 在 Docker Desktop/OrbStack 上，使用实际的主机路径如 /Users/username/...
      # 在运行 docker-compose 前在 shell 中设置：
      #   export DEER_FLOW_ROOT=/absolute/path/to/deer-flow
      - SKILLS_HOST_PATH=${DEER_FLOW_ROOT}/skills
      - THREADS_HOST_PATH=${DEER_FLOW_ROOT}/backend/.deer-flow/threads
      # 生产环境：使用 PVC 替代 hostPath，避免节点故障时数据丢失。
      # 设置后，上面的 hostPath 变量会被忽略。
      # USERDATA_PVC_NAME 自动使用子路径（deer-flow/users/{user_id}/threads/{thread_id}/user-data）。
      # - SKILLS_PVC_NAME=deer-flow-skills-pvc
      # - USERDATA_PVC_NAME=deer-flow-userdata-pvc
      - KUBECONFIG_PATH=/root/.kube/config
      - NODE_HOST=host.docker.internal
      # 覆盖 K8s API server URL，因为 kubeconfig 使用 127.0.0.1
      # 这个地址在容器内部是无法访问的
      - K8S_API_SERVER=https://host.docker.internal:26443
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - deer-flow-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # ── 反向代理 ─────────────────────────────────────────────────────────
  # 将 API 流量路由到 gateway 和（可选的）provisioner。
  nginx:
    image: nginx:alpine
    container_name: deer-flow-nginx
    ports:
      - "2026:2026"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
    command:
      - sh
      - -c
      - |
        set -e
        cp /etc/nginx/nginx.conf.template /etc/nginx/nginx.conf
        test -e /proc/net/if_inet6 || sed -i '/^[[:space:]]*listen[[:space:]]\+\[::\]:2026;/d' /etc/nginx/nginx.conf
        exec nginx -g 'daemon off;'
    depends_on:
      - frontend
      - gateway
    networks:
      - deer-flow-dev
    restart: unless-stopped

  # Frontend - Next.js 开发服务器
  frontend:
    build:
      context: ../
      dockerfile: frontend/Dockerfile
      target: dev
      args:
        PNPM_STORE_PATH: ${PNPM_STORE_PATH:-/root/.local/share/pnpm/store}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    container_name: deer-flow-frontend
    command: sh -c "cd frontend && pnpm run dev > /app/logs/frontend.log 2>&1"
    volumes:
      - ../frontend/src:/app/frontend/src
      - ../frontend/public:/app/frontend/public
      - ../frontend/next.config.js:/app/frontend/next.config.js:ro
      - ../logs:/app/logs
      # 挂载 pnpm store 用于缓存
      - ${PNPM_STORE_PATH:-~/.local/share/pnpm/store}:/root/.local/share/pnpm/store
    working_dir: /app
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - CI=true
      - DEER_FLOW_INTERNAL_GATEWAY_BASE_URL=http://gateway:8001
    env_file:
      - ../frontend/.env
    networks:
      - deer-flow-dev
    restart: unless-stopped

  # Backend - Gateway API
  gateway:
    build:
      context: ../
      dockerfile: backend/Dockerfile
      target: dev
      # cache_from 已禁用 - 需要手动设置：mkdir -p /tmp/docker-cache-gateway
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.7.20}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.org/simple}
    container_name: deer-flow-gateway
    # 启动逻辑在 docker/dev-entrypoint.sh 中 — UV_EXTRAS 验证、
    # `uv sync --all-packages`、.venv 自我修复和 uvicorn 交接。
    # 保持此文件可读性并允许脚本被 shellcheck 检查。
    # 见 PR #2767 / Issue #2754。
    command: ["sh", "/usr/local/bin/dev-entrypoint.sh"]
    volumes:
      # 将 dev entrypoint 作为只读文件挂载，这样编辑脚本后
      # `make docker-restart` 会生效而无需重建镜像。
      - ./dev-entrypoint.sh:/usr/local/bin/dev-entrypoint.sh:ro
      - ../backend/:/app/backend/
      # 保留 Docker 镜像构建期间创建的 .venv — 否则挂载完整的 backend/
      # 目录会被（空的）主机目录覆盖
      - gateway-venv:/app/backend/.venv
      - ../config.yaml:/app/config.yaml
      - ../extensions_config.json:/app/extensions_config.json
      - ../skills:/app/skills
      - ../logs:/app/logs
      # 使用 Docker 管理的 uv 缓存卷而不是主机绑定挂载。
      # 在 macOS/Docker Desktop 上，uv 可能在共享主机目录内创建符号链接失败，
      # 这会导致启动时的 `uv sync` 崩溃。
      - gateway-uv-cache:/root/.cache/uv
      # DooD：AioSandboxProvider 在 Gateway 进程内运行。
      - /var/run/docker.sock:/var/run/docker.sock
      # CLI 认证目录，用于自动认证（Claude Code + Codex CLI）
      - type: bind
        source: ${HOME:?HOME must be set}/.claude
        target: /root/.claude
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: ${HOME:?HOME must be set}/.codex
        target: /root/.codex
        read_only: true
        bind:
          create_host_path: true
    working_dir: /app
    environment:
      - CI=true
      - DEER_FLOW_PROJECT_ROOT=/app
      - DEER_FLOW_HOME=/app/backend/.deer-flow
      - DEER_FLOW_CHANNELS_LANGGRAPH_URL=${DEER_FLOW_CHANNELS_LANGGRAPH_URL:-http://gateway:8001/api}
      - DEER_FLOW_CHANNELS_GATEWAY_URL=${DEER_FLOW_CHANNELS_GATEWAY_URL:-http://gateway:8001}
      - DEER_FLOW_HOST_BASE_DIR=${DEER_FLOW_ROOT}/backend/.deer-flow
      - DEER_FLOW_HOST_SKILLS_PATH=${DEER_FLOW_ROOT}/skills
      - DEER_FLOW_SANDBOX_HOST=host.docker.internal
    env_file:
      - ../.env
    extra_hosts:
      # Linux：映射 host.docker.internal 到宿主机网关
      - "host.docker.internal:host-gateway"
    networks:
      - deer-flow-dev
    restart: unless-stopped

volumes:
  # 持久化 .venv 使其跨容器重启存在，避免镜像构建期间安装的依赖
  # 被主机 backend/ 目录挂载所覆盖。
  gateway-venv:
  gateway-uv-cache:

networks:
  deer-flow-dev:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.200.0/24
